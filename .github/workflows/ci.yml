name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Test release tooling
        run: ./Scripts/test-release.sh
      - name: Build Dozer.app
        run: make zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dozer
          path: build/Dozer.zip
