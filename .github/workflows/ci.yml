name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build Dozer.app
        run: make zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dozer
          path: build/Dozer.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Dozer.zip --generate-notes --title "Dozer ${GITHUB_REF_NAME#v}"
    permissions:
      contents: write
